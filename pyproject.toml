[project]
name = "jackal-comfyui-chunkstepper"
version = "0.1.0"
description = "ComfyUI custom node for iterative video chunk generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.urls]
Repository = "https://github.com/pksebben/jackal_comfyui_chunkstepper"

[project.scripts]
stitch = "stitch:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nodes"]

[tool.pyrefly]
project_includes = ["."]
